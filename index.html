<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Android ast</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <!-- particles -->
    <div class="particles" id="particles"></div>
    <div class="card">
      <div class="card-glow"></div>
      <div class="card-inner">
        <!-- HEADER -->
        <div class="card-header">
          <div class="avatar-wrap">
            <div class="avatar-ring2"></div>
            <div class="avatar-ring"></div>
            <div class="avatar-ping"></div>
            <div class="avatar">
              <img src="icon.png" alt="icon" height="80">
            </div>
          </div>
          <div class="name">CYBER</div>
          <div class="role">
            <span class="live-dot"></span>
            Developer
          </div>
          <div class="stats-row">
            <div class="stat">
              <div class="stat-val">ROMS</div>
              <div class="stat-lbl">MODER</div>
            </div>
            <div class="stat">
              <div class="stat-val">LOVE</div>
              <div class="stat-lbl">JAVA</div>
            </div>
            <div class="stat">
              <div class="stat-val">DEV</div>
              <div class="stat-lbl">Active</div>
            </div>
          </div>
        </div>
        <div class="divider"></div>
        <!-- SOCIAL -->
        <div class="social-section">
          <a class="social-btn telegram" href="https://t.me/CYBER_OFFICIAL_ast" target="_blank" rel="noopener">
            <div class="ripple-bg"></div>
            <div class="social-icon-wrap">
              <div class="social-icon">
                <svg viewBox="0 0 24 24">
                  <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z" />
                </svg>
              </div>
            </div>
            <span class="social-label">Telegram</span>
          </a>
          <a class="social-btn youtube" href="https://youtube.com/@androidhelper67?si=04K_Ch_gSEO3tg83" target="_blank" rel="noopener">
            <div class="ripple-bg"></div>
            <div class="social-icon-wrap">
              <div class="social-icon">
                <svg viewBox="0 0 24 24">
                  <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z" />
                </svg>
              </div>
            </div>
            <span class="social-label">YouTube</span>
          </a>
        </div>
        <div class="divider"></div>
        <!-- APP DOWNLOAD -->
        <div class="app-section">
          <div class="app-section-label">My App</div>
          <a class="app-card" href="https://cyberkillert.github.io/Androidast/" target="_blank" rel="noopener">
            <div class="app-icon">
              <img src="icon.png" alt="icon" height="40">
            </div>
            <div class="app-info">
              <span class="app-name">Android ast</span>
              <span class="app-desc">exclusive collection of tools</span>
            </div>
            <div class="dl-btn">
              <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
              Get
            </div>
          </a>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
